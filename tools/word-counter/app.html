<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Characters and Words Count Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 1800px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 200px;
      font-size: 1em;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    .stats {
      margin-top: 20px;
      background-color: #f4f4f4;
      padding: 15px;
      border-radius: 6px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Characters and Words Count Tool</h1>
  <textarea id="textInput" placeholder="Input your text here !"></textarea>

  <div class="stats">
    <p>🔹 Total # of characters (including spaces): <span id="charWithSpaces">0</span></p>
    <p>🔹 Total # of characters (excluding spaces): <span id="charWithoutSpaces">0</span></p>
    <p>🔹 Total # of words (excuding spaces): <span id="wordCount">0</span></p>
    <p>🔹 Total # of words (including spaces): <span id="wordWithSpacesCount">0</span></p>
  </div>

  <script>
    const textarea = document.getElementById("textInput");
    const charWithSpaces = document.getElementById("charWithSpaces");
    const charWithoutSpaces = document.getElementById("charWithoutSpaces");
    const wordCount = document.getElementById("wordCount");
    const wordWithSpacesCount = document.getElementById("wordWithSpacesCount");

    textarea.addEventListener("input", () => {
      const text = textarea.value;

      
      charWithSpaces.textContent = text.length;
      charWithoutSpaces.textContent = text.replace(/\s/g, "").length;

      
      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      const wordCountValue = words.length;
      wordCount.textContent = wordCountValue;

      
      const spaceCount = (text.match(/\s/g) || []).length;

     
      wordWithSpacesCount.textContent = wordCountValue + spaceCount;
    });
  </script>

</body>
</html>
