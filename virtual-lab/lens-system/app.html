                this.ctx.arc(f1_leftX, this.originY, 4, 0, 2 * Math.PI);
                this.ctx.fill();
                this.ctx.fillText('F1', f1_leftX, this.originY - 10);
                
                const f1_rightX = lens1X + f1 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(f1_rightX, this.originY, 4, 0, 2 * Math.PI);
                this.ctx.fill();
                this.ctx.fillText('F1\'', f1_rightX, this.originY - 10);
                
                // Lens 2 focal points
                const lens2X = this.originX + this.lens2Position * this.scale;
                const f2 = Math.abs(this.lens2Focal);
                
                const f2_leftX = lens2X - f2 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(f2_leftX, this.originY, 4, 0, 2 * Math.PI);
                this.ctx.fill();
                this.ctx.fillText('F2', f2_leftX, this.originY - 10);
                
                const f2_rightX = lens2X + f2 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(f2_rightX, this.originY, 4, 0, 2 * Math.PI);
                this.ctx.fill();
                this.ctx.fillText('F2\'', f2_rightX, this.originY - 10);
            }
            
            drawRays() {
                // CRITICAL: "Show Ray Arrows" 체크박스로 전체 광선 표시/숨김 제어
                if (!document.getElementById('doubleShowRayArrows').checked) {
                    return; // 전체 광선을 그리지 않음
                }
                
                const objX = this.originX + this.objectPosition * this.scale;
                const lens1X = this.originX + this.lens1Position * this.scale;
                const lens2X = this.originX + this.lens2Position * this.scale;
                const objHeight = this.objectHeight * this.scale * this.verticalScale;
                
                const results = this.calculateDoubleLensSystem();
                
                if (results.totalMag === Infinity) return;
                
                // Calculate intermediate image position and height
                const intermediateX = this.originX + results.intermediateImagePosition * this.scale;
                const intermediateHeight = Math.abs(results.lens1Mag) * this.objectHeight * this.scale * this.verticalScale;
                const intermediateY = results.lens1Mag > 0 ? 
                    this.originY - intermediateHeight : this.originY + intermediateHeight;
                
                // Calculate final image position and height
                const finalX = this.originX + results.finalImagePosition * this.scale;
                const finalHeight = Math.abs(results.totalMag) * this.objectHeight * this.scale * this.verticalScale;
                const finalY = results.isUpright ? 
                    this.originY - finalHeight : this.originY + finalHeight;
                
                this.ctx.strokeStyle = '#4CAF50';
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([]);
                
                // "Show Rays" 체크박스로 화살표 끝부분 표시/숨김 제어
                const showArrowTips = document.getElementById('doubleShowRays').checked;
                
                // Ray 1: Parallel to axis, through focal point after lens 1
                if (showArrowTips) {
                    this.drawArrowRay(objX, this.originY - objHeight, lens1X, this.originY - objHeight);
                    this.drawArrowRay(lens1X, this.originY - objHeight, intermediateX, intermediateY);
                    
                    // Continue ray from intermediate image to lens 2
                    this.drawArrowRay(intermediateX, intermediateY, lens2X, intermediateY);
                    this.drawArrowRay(lens2X, intermediateY, finalX, finalY);
                    
                    // Ray 2: Through center of lens 1
                    this.drawArrowRay(objX, this.originY - objHeight, lens1X, this.originY);
                    this.drawArrowRay(lens1X, this.originY, intermediateX, intermediateY);
                    
                    // Continue center ray from intermediate image to lens 2
                    this.drawArrowRay(intermediateX, intermediateY, lens2X, this.originY);
                    this.drawArrowRay(lens2X, this.originY, finalX, finalY);
                } else {
                    this.drawSimpleRay(objX, this.originY - objHeight, lens1X, this.originY - objHeight);
                    this.drawSimpleRay(lens1X, this.originY - objHeight, intermediateX, intermediateY);
                    
                    // Continue ray from intermediate image to lens 2
                    this.drawSimpleRay(intermediateX, intermediateY, lens2X, intermediateY);
                    this.drawSimpleRay(lens2X, intermediateY, finalX, finalY);
                    
                    // Ray 2: Through center of lens 1
                    this.drawSimpleRay(objX, this.originY - objHeight, lens1X, this.originY);
                    this.drawSimpleRay(lens1X, this.originY, intermediateX, intermediateY);
                    
                    // Continue center ray from intermediate image to lens 2
                    this.drawSimpleRay(intermediateX, intermediateY, lens2X, this.originY);
                    this.drawSimpleRay(lens2X, this.originY, finalX, finalY);
                }
            }
            
            drawArrowRay(x1, y1, x2, y2) {
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
                
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const arrowLength = 8;
                const arrowAngle = Math.PI / 6;
                
                this.ctx.beginPath();
                this.ctx.moveTo(x2, y2);
                this.ctx.lineTo(
                    x2 - arrowLength * Math.cos(angle - arrowAngle),
                    y2 - arrowLength * Math.sin(angle - arrowAngle)
                );
                this.ctx.moveTo(x2, y2);
                this.ctx.lineTo(
                    x2 - arrowLength * Math.cos(angle + arrowAngle),
                    y2 - arrowLength * Math.sin(angle + arrowAngle)
                );
                this.ctx.stroke();
            }
            
            drawImages() {
                const results = this.calculateDoubleLensSystem();
                
                if (results.totalMag === Infinity) return;
                
                // Draw intermediate image (dashed line, lighter color)
                if (document.getElementById('doubleShowIntermediateImage').checked && 
                    results.intermediateImagePosition > 0 && results.intermediateImagePosition < this.systemLength + 10) {
                    const intermediateX = this.originX + results.intermediateImagePosition * this.scale;
                    const intermediateHeight = Math.abs(results.lens1Mag) * this.objectHeight * this.scale * this.verticalScale;
                    const displayIntermediateHeight = Math.max(15, intermediateHeight);
                    const intermediateArrowSize = Math.max(4, displayIntermediateHeight * 0.2);
                    
                    this.ctx.strokeStyle = '#FF9800';
                    this.ctx.fillStyle = '#FF9800';
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([3, 3]);
                    this.ctx.globalAlpha = 0.7;
                    
                    const startY = this.originY;
                    const endY = results.lens1Mag > 0 ? 
                        this.originY - displayIntermediateHeight : 
                        this.originY + displayIntermediateHeight;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(intermediateX, startY);
                    this.ctx.lineTo(intermediateX, endY);
                    this.ctx.stroke();
                    
                    // Arrow head
                    this.ctx.beginPath();
                    this.ctx.moveTo(intermediateX, endY);
                    if (results.lens1Mag > 0) {
                        this.ctx.lineTo(intermediateX - intermediateArrowSize, endY + intermediateArrowSize * 2);
                        this.ctx.lineTo(intermediateX + intermediateArrowSize, endY + intermediateArrowSize * 2);
                    } else {
                        this.ctx.lineTo(intermediateX - intermediateArrowSize, endY - intermediateArrowSize * 2);
                        this.ctx.lineTo(intermediateX + intermediateArrowSize, endY - intermediateArrowSize * 2);
                    }
                    this.ctx.closePath();
                    this.ctx.fill();
                    
                    this.ctx.font = `${12 * this.textScale}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Intermediate Image', intermediateX, this.originY + 35);
                    
                    this.ctx.setLineDash([]);
                    this.ctx.globalAlpha = 1.0;
                }
                
                // Draw final image
                if (document.getElementById('doubleShowFinalImage').checked && 
                    Math.abs(results.finalImagePosition) <= this.systemLength + 10) {
                    const finalX = this.originX + results.finalImagePosition * this.scale;
                    const finalHeight = Math.abs(results.totalMag) * this.objectHeight * this.scale * this.verticalScale;
                    const displayFinalHeight = Math.max(15, finalHeight);
                    const finalArrowSize = Math.max(6, displayFinalHeight * 0.3) * this.imageArrowScale;
                    
                    this.ctx.strokeStyle = results.isReal ? '#9C27B0' : '#FF5722';
                    this.ctx.fillStyle = results.isReal ? '#9C27B0' : '#FF5722';
                    this.ctx.lineWidth = results.isReal ? 3 : 2;
                    
                    if (!results.isReal) {
                        this.ctx.setLineDash([5, 5]);
                    }
                    
                    const startY = this.originY;
                    const endY = results.isUpright ? 
                        this.originY - displayFinalHeight : 
                        this.originY + displayFinalHeight;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(finalX, startY);
                    this.ctx.lineTo(finalX, endY);
                    this.ctx.stroke();
                    
                    // Arrow head
                    this.ctx.beginPath();
                    this.ctx.moveTo(finalX, endY);
                    if (results.isUpright) {
                        this.ctx.lineTo(finalX - finalArrowSize, endY + finalArrowSize * 2);
                        this.ctx.lineTo(finalX + finalArrowSize, endY + finalArrowSize * 2);
                    } else {
                        this.ctx.lineTo(finalX - finalArrowSize, endY - finalArrowSize * 2);
                        this.ctx.lineTo(finalX + finalArrowSize, endY - finalArrowSize * 2);
                    }
                    this.ctx.closePath();
                    this.ctx.fill();
                    
                    this.ctx.setLineDash([]);
                    
                    this.ctx.font = `${14 * this.textScale}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(results.isReal ? 'Real Final Image' : 'Virtual Final Image', finalX, this.originY + 50);
                }
            }
            
            updateDisplay() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.canvas.width === 0 || this.canvas.height === 0) {
                    return;
                }
                
                this.drawGrid();
                this.drawAxis();
                this.drawFocalPoints();
                this.drawObject();
                
                // Draw lenses
                const lens1X = this.originX + this.lens1Position * this.scale;
                const lens2X = this.originX + this.lens2Position * this.scale;
                
                this.drawLens(lens1X, this.lens1Type, 'Lens 1');
                this.drawLens(lens2X, this.lens2Type, 'Lens 2');
                
                this.drawRays();
                this.drawImages();
                
                this.updateInfo();
            }
            
            updateInfo() {
                const results = this.calculateDoubleLensSystem();
                
                if (results.lens1Mag === Infinity || results.lens2Mag === Infinity || results.totalMag === Infinity) {
                    document.getElementById('doubleLens1MagOutput').value = results.lens1Mag === Infinity ? '∞' : results.lens1Mag.toFixed(2);
                    document.getElementById('doubleLens2MagOutput').value = results.lens2Mag === Infinity ? '∞' : results.lens2Mag.toFixed(2);
                    document.getElementById('doubleTotalMagOutput').value = '∞';
                    document.getElementById('doubleFinalImageDistanceOutput').value = '∞';
                    document.getElementById('doubleFinalImageTypeOutput').value = 'Parallel rays';
                } else {
                    document.getElementById('doubleLens1MagOutput').value = results.lens1Mag.toFixed(2);
                    document.getElementById('doubleLens2MagOutput').value = results.lens2Mag.toFixed(2);
                    document.getElementById('doubleTotalMagOutput').value = results.totalMag.toFixed(2);
                    document.getElementById('doubleFinalImageDistanceOutput').value = results.finalImageDistance.toFixed(1);
                    
                    let imageType = '';
                    imageType += results.isReal ? 'Real, ' : 'Virtual, ';
                    imageType += results.isUpright ? 'Upright' : 'Inverted';
                    imageType += Math.abs(results.totalMag) > 1 ? ', Magnified' : ', Reduced';
                    
                    document.getElementById('doubleFinalImageTypeOutput').value = imageType;
                }
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize single lens system by default
            window.singleSystem = new SingleLensSystem();
        });
        
        window.addEventListener('load', () => {
            if (!window.singleSystem) {
                window.singleSystem = new SingleLensSystem();
            }
        });
    </script>
</body>
</html>
