<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fraunhofer diffraction pattern calculator: 1D linear slits</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f7f7f7;
      max-width: 1100px;
      margin: auto;
    }
    h1 {
      text-align: justify;
    }
    .container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .controls {
      width: 45%;
    }
    .input-group {
      margin-bottom: 5px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 40%;
      padding: 3px;
      box-sizing: border-box;
    }
    #diffractionPlot {
      width: 1200px;
      height: 400px;
      margin-left: 00px;
      margin-top: 0px;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Fraunhofer diffraction pattern calculator: 1D linear slits</h1>
  <h2>(Far-field-diffraction pattern without Fresnel integral)</h2>
  <div class="container">
    <div class="controls">
      <div class="input-group">
        <label>Wavelength (λ) [nm]:</label>
        <input type="number" id="lambda" value="632.8">
      </div>
      <div class="input-group">
        <label>Slit Width (a) [mm]:</label>
        <input type="number" id="slitWidth" value="0.1" step="0.1">
      </div>
      <div class="input-group">
        <label>Slit Separation (d) [mm]:</label>
        <input type="number" id="slitSeparation" value="0.5" step="0.1">
      </div>
      <div class="input-group">
        <label>Number of Slits (N):</label>
        <input type="number" id="numSlits" value="2">
      </div>
      <div class="input-group">
        <label>Screen Distance (L) [m]:</label>
        <input type="number" id="distance" value="1" step="0.1">
      </div>
      <div class="input-group">
        <label>X-axis Range [cm]: ±</label>
        <input type="number" id="xRange" value="1.5">
      </div>
      <div class="input-group">
        <label>Number of Points:</label>
        <input type="number" id="points" value="500">
      </div>
      <button onclick="downloadData()">Download Data</button>
    </div>
    <div id="diffractionPlot"></div>
  </div>

<script>
const lambdaInput = document.getElementById('lambda');
const slitWidthInput = document.getElementById('slitWidth');
const slitSeparationInput = document.getElementById('slitSeparation');
const numSlitsInput = document.getElementById('numSlits');
const distanceInput = document.getElementById('distance');
const xRangeInput = document.getElementById('xRange');
const pointsInput = document.getElementById('points');

function computeDiffraction() {
  const lambda = parseFloat(lambdaInput.value) * 1e-9;
  const a = parseFloat(slitWidthInput.value) * 1e-3;
  const d = parseFloat(slitSeparationInput.value) * 1e-3;
  const N = parseInt(numSlitsInput.value);
  const L = parseFloat(distanceInput.value);
  const xRange = parseFloat(xRangeInput.value) / 100;
  const points = parseInt(pointsInput.value);

  const xValues = [];
  const intensityValues = [];

  for (let i = 0; i < points; i++) {
    const x = -xRange + (2 * xRange) * (i / (points - 1));
    const beta = Math.PI * a * x / (lambda * L);
    const delta = Math.PI * d * x / (lambda * L);

    const singleSlitFactor = (beta !== 0) ? Math.pow(Math.sin(beta) / beta, 2) : 1;
    const multiSlitFactor = (delta !== 0) ? Math.pow(Math.sin(N * delta) / Math.sin(delta), 2) : N * N;

    const intensity = singleSlitFactor * multiSlitFactor;

    xValues.push(x * 100); // cm
    intensityValues.push(intensity);
  }

  return { xValues, intensityValues };
}

function updatePlotlyPlot() {
  const { xValues, intensityValues } = computeDiffraction();

  const trace = {
    x: xValues,
    y: intensityValues,
    mode: 'lines',
    name: 'Intensity [arb. unit]',
    line: { width: 2 }
  };

  const layout = {
    title: 'Fraunhofer Diffraction Pattern (Double click to zoom back out)',
    xaxis: {
      title: 'Position at screen [cm]',
      range: [-parseFloat(xRangeInput.value), parseFloat(xRangeInput.value)],
      tickformat: '.1f',
      zeroline: true,
      showgrid: true,
      ticks: 'outside',
    },
    yaxis: {
      title: 'Intensity [arb. unit]',
      rangemode: 'tozero',
      showgrid: true,
      ticks: 'outside'
    },
    margin: { t: 40, l: 60, r: 10, b: 60 },
    plot_bgcolor: '#fff',
    paper_bgcolor: '#fff',
  };

  Plotly.newPlot('diffractionPlot', [trace], layout, {responsive: false, displayModeBar: false});
}

function downloadData() {
  const { xValues, intensityValues } = computeDiffraction();
  let dataStr = 'Position(cm)\tIntensity\n';
  xValues.forEach((x, i) => dataStr += `${x}\t${intensityValues[i]}\n`);

  const blob = new Blob([dataStr], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'multiple_slit_diffraction_data.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

lambdaInput.oninput = updatePlotlyPlot;
slitWidthInput.oninput = updatePlotlyPlot;
slitSeparationInput.oninput = updatePlotlyPlot;
numSlitsInput.oninput = updatePlotlyPlot;
distanceInput.oninput = updatePlotlyPlot;
xRangeInput.oninput = updatePlotlyPlot;
pointsInput.oninput = updatePlotlyPlot;

// 최초 1회 실행
updatePlotlyPlot();
</script>
</body>
</html>
